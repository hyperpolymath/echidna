# SPDX-License-Identifier: MPL-2.0
# cargo-audit configuration (read by `cargo audit` from .cargo/audit.toml).

[advisories]
# zip 8.6.0 extraction advisories. zip is reached only as a *build*
# dependency of utoipa-swagger-ui (src/interfaces/rest), whose build script
# unpacks the pinned Swagger UI archive; no echidna binary links zip or
# extracts untrusted archives at runtime. Every utoipa-swagger-ui release up
# to 10.0.1 requires zip ^8.6, so the >=9.0.0 fix cannot be selected yet.
# Remove these entries once utoipa-swagger-ui accepts zip >=9.
ignore = [
    "RUSTSEC-2026-0367", # SUID/SGID bits preserved during extraction
    "RUSTSEC-2026-0368", # extract() symlinks pointing outside destination
    "RUSTSEC-2026-0369", # extract() applies permissions through symlinks
]
