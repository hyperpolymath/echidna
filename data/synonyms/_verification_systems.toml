#
# Verification-systems vocabulary. Program-verification concepts for the
# estate's proof stack (Idris2 ABI + Zig FFI + Ada/SPARK + Rust/Creusot +
# Elixir/OTP), which WordNet and ConceptNet do not carry.
#
# Underscore-prefix filename `_verification_systems.toml` signals: secondary
# vocabulary index, NOT a per-prover synonym table. Consumers merge it into
# per-prover `semantic_class` resolution through
# `CrossProverDicts::verification_systems` (Rust) / `load_verification_systems`
# (Julia), exactly like `_msc2020.toml` and `_disciplines.toml`.
#
# Why this file exists
#
# `_wordnet_math.toml` (81 rows) and `_conceptnet_seed.toml` (53 rows) are
# anchored in undergraduate / competition pure mathematics: primes, rings,
# continuity, commutativity. ProofNet and MiniF2F are the same shape. The
# concepts this repository's own verification surface is written in --
# zero-extension, wrapping arithmetic, alignment, separation-logic framing,
# termination measures, resource algebras, noninterference -- are absent from
# those dictionaries. A corpus indexer or premise selector that only knows the
# math dictionaries cannot resolve `wrapping_add` to a semantic class, so the
# cross-prover join silently drops the row.
#
# Selection criteria
#
# 1. The concept must be *load-bearing* for machine-level or specification-level
#    reasoning: it appears in at least one of the proof corpora / toolchains
#    this repository drives (Lean4+mathlib4, Coq/Rocq, Isabelle/HOL, Agda,
#    Idris2, F*, Dafny, Why3, SPARK, Creusot, Kani, Zig, ACL2, TLA+).
# 2. `canonical` is the concept name in the spelling used by the toolchain that
#    owns the concept (mostly snake_case; PascalCase where the library name is
#    PascalCase).
# 3. `aliases` are spelling variants and API names a corpus extractor can
#    actually encounter, not definitions.
# 4. `semantic_class` is the cross-table join key and is deliberately coarse.
#    `tactic_class` is the vocabulary family for this file: bitvector, memory,
#    ownership, separation, contract, termination, refinement, resource-algebra,
#    epistemic, concurrency, toolchain, estate.
#
# Estate policy reflected here (owner directive, 2026-10-22): every ABI is
# written in Idris2, every API and FFI in Zig, every BEAM native boundary is a
# SNIF (never a bare NIF), the Rust layer is Rust/Creusot (annotated Rust, not
# "Rust plus hope"), Julia owns the numeric/ML layer and Chapel the parallel
# layer. Python is not part of the estate: nothing in this tree may depend on a
# Python runtime.
#
# Evidence policy
#
# Rows carry no `evidence` field (the loader default is `none`). These are
# vocabulary anchors: they assert that a token belongs to a concept class, not
# that two provers' names denote the same proposition. Rows that would claim a
# cross-prover identity belong in the per-prover tables, where the lexicon v2
# `relation` / `fidelity` / `residue` fields can say what is lost.
#
# Schema: data/synonyms/schema.ncl (Nickel). Checked by
# scripts/lexicon-check.sh; loaded by tests/lexicon_v2_test.rs.

# ============================================================
