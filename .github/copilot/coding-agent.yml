# Copilot coding-agent MCP servers. Bun, not npx: npm/npx are banned in this
# estate (2026-05-25); `bunx` runs the same package.
{
  mcp_servers: {
    boj-server: {
      command: "bunx",
      args: [
        "@hyperpolymath/boj-server@latest",
      ],
      env: {
        BOJ_URL: "http://localhost:7700",
      },
    },
  },
}
