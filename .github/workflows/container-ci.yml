#
# container-ci.yml — Container build verification.
#
# Jobs, all blocking:
#   container-build         — builds and verifies the minimal ECHIDNA image.
#   container-rebuild       — builds the same image again on an independent
#                             runner.
#   container-reproducible  — requires both builds to have the same image ID.
#                             This is the reproducibility check that replaced
#                             the T1 Guix manifest job (owner ruling, CI-4):
#                             the Containerfile is the reproducibility path.
#   tier3-container         — builds each Wave-3 prover image weekly (Sunday
#                             06:00 UTC); proprietary builds excluded.
#
# Both minimal builds use --no-cache and --timestamp 0, so creation times
# and file mtimes cannot make two builds of the same inputs differ. A
# mismatch means an input floats (an unpinned package, a download without
# a digest, a non-deterministic build step). The compare job prints the
# layer digests of both builds, and the deepest paths whose digests differ
# (each build prints a per-path fingerprint, scripts/ci/fs-fingerprint.sh).

name: Container Build Verification

on:
  push:
    # Cause-B mitigation (#77): was any-branch (path-filtered only);
    # scoped to integration branches so feature-branch pushes that
    # touch these paths don't also fan out a container build.
    branches: [main, master]
    paths:
      - 'Containerfile'
      - 'scripts/ci/install-lean.sh'
      - 'scripts/ci/fs-fingerprint.sh'
      - '.containerization/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/rust/**'
      - '.github/workflows/container-ci.yml'
  pull_request:
    paths:
      - 'Containerfile'
      - 'scripts/ci/install-lean.sh'
      - 'scripts/ci/fs-fingerprint.sh'
      - '.containerization/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/rust/**'
      - '.github/workflows/container-ci.yml'
  schedule:
    # Weekly build of Tier-3 prover images (Sunday 06:00 UTC).
    # Distinct from live-provers.yml Tier-3 run (Sunday 05:00 UTC)
    # so the container build does not race the live-prover tests.
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cause-B mitigation (#77): de-duplicate superseded builds on the same
# ref. cancel-in-progress is false so an in-flight image build/publish
# is never interrupted mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Job 1: minimal image — hard gate on every PR/push ─────────────────────
  container-build:
    name: Build & verify container image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image-id: ${{ steps.identity.outputs.image-id }}
      layers: ${{ steps.identity.outputs.layers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman

      - name: Build minimal container image
        run: |
          podman build \
            -f Containerfile \
            -t echidna:ci-test \
            --no-cache \
            --timestamp 0 \
            .

      - name: Record image identity
        id: identity
        run: |
          set -euo pipefail
          echo "image-id=$(podman image inspect echidna:ci-test --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "layers=$(podman image inspect echidna:ci-test --format '{{json .RootFS.Layers}}')" >> "$GITHUB_OUTPUT"

      # Per-path digests of the image filesystem, printed between markers so
      # container-reproducible can name the drifting paths, not only the layer.
      - name: Fingerprint the image filesystem
        run: |
          set -euo pipefail
          cid=$(podman create echidna:ci-test)
          podman export "$cid" | bash scripts/ci/fs-fingerprint.sh 12 > "$RUNNER_TEMP/fs-fingerprint"
          podman rm "$cid" >/dev/null
          echo "fs-fingerprint: $(wc -l < "$RUNNER_TEMP/fs-fingerprint") paths"
          echo "::group::fs-fingerprint (depth 12)"
          echo "FS-FINGERPRINT-BEGIN"
          cat "$RUNNER_TEMP/fs-fingerprint"
          echo "FS-FINGERPRINT-END"
          echo "::endgroup::"

      - name: Verify image metadata
        run: |
          echo "=== Image labels ==="
          podman inspect echidna:ci-test \
            --format '{{range $k, $v := .Config.Labels}}{{$k}}: {{$v}}{{"\n"}}{{end}}'
          echo "=== Image size ==="
          podman images echidna:ci-test --format "{{.Size}}"

      - name: Verify ECHIDNA binary runs
        run: |
          echo "=== echidna --version ==="
          podman run --rm echidna:ci-test --version
          echo "=== echidna --help ==="
          podman run --rm echidna:ci-test --help

      - name: Verify solver availability inside container
        run: |
          echo "=== Checking installed solvers ==="
          podman run --rm --entrypoint /bin/sh echidna:ci-test -ec '
            echo "Z3:"; z3 --version
            echo "Lean:"; lean --version
          '

      - name: Clean up
        if: always()
        run: podman rmi echidna:ci-test 2>/dev/null || true

  # ── Containerfile reproducibility: an independent rebuild ─────────────────
  container-rebuild:
    name: Rebuild container image (independent runner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image-id: ${{ steps.identity.outputs.image-id }}
      layers: ${{ steps.identity.outputs.layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman

      - name: Rebuild minimal container image
        run: |
          podman build \
            -f Containerfile \
            -t echidna:ci-rebuild \
            --no-cache \
            --timestamp 0 \
            .

      - name: Record image identity
        id: identity
        run: |
          set -euo pipefail
          echo "image-id=$(podman image inspect echidna:ci-rebuild --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "layers=$(podman image inspect echidna:ci-rebuild --format '{{json .RootFS.Layers}}')" >> "$GITHUB_OUTPUT"

      # Per-path digests of the image filesystem, printed between markers so
      # container-reproducible can name the drifting paths, not only the layer.
      - name: Fingerprint the image filesystem
        run: |
          set -euo pipefail
          cid=$(podman create echidna:ci-rebuild)
          podman export "$cid" | bash scripts/ci/fs-fingerprint.sh 12 > "$RUNNER_TEMP/fs-fingerprint"
          podman rm "$cid" >/dev/null
          echo "fs-fingerprint: $(wc -l < "$RUNNER_TEMP/fs-fingerprint") paths"
          echo "::group::fs-fingerprint (depth 12)"
          echo "FS-FINGERPRINT-BEGIN"
          cat "$RUNNER_TEMP/fs-fingerprint"
          echo "FS-FINGERPRINT-END"
          echo "::endgroup::"

  container-reproducible:
    name: Containerfile reproducibility (same image ID twice)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container-build, container-rebuild]
    permissions:
      actions: read     # read the two build jobs' logs for their fs-fingerprints
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compare the two builds
        env:
          GH_TOKEN: ${{ github.token }}
          ID_A: ${{ needs.container-build.outputs.image-id }}
          ID_B: ${{ needs.container-rebuild.outputs.image-id }}
          LAYERS_A: ${{ needs.container-build.outputs.layers }}
          LAYERS_B: ${{ needs.container-rebuild.outputs.layers }}
        run: |
          set -euo pipefail
          if [ -z "$ID_A" ] || [ -z "$ID_B" ]; then echo "::error::a build reported no image ID"; exit 1; fi
          {
            echo "## Containerfile reproducibility"
            echo "build:   $ID_A"
            echo "rebuild: $ID_B"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ID_A" = "$ID_B" ]; then
            echo "OK: two independent --no-cache --timestamp 0 builds gave image $ID_A"
            exit 0
          fi
          echo "::error::The Containerfile is not reproducible: two builds of the same commit gave $ID_A and $ID_B."
          paste <(jq -r '.[]' <<<"$LAYERS_A") <(jq -r '.[]' <<<"$LAYERS_B") \
            | awk -F '\t' '{ printf "layer %d: %s %s %s\n", NR, ($1 == $2 ? "same" : "DIFFERS"), $1, $2 }' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Name the drift: each build job printed per-path digests of its
          # image between markers (scripts/ci/fs-fingerprint.sh).
          fingerprint() {
            local id
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
                   --paginate --jq ".jobs[] | select(.name == \"$1\") | .id" | head -n 1)
            [ -n "$id" ] || { echo "::warning::no job named '$1' in this run attempt"; return 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" \
              | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' \
              | sed -n '/^FS-FINGERPRINT-BEGIN$/,/^FS-FINGERPRINT-END$/p' \
              | grep -E '^[0-9a-f]{64}  '
          }
          if fingerprint "Build & verify container image" > "$RUNNER_TEMP/fp-a" \
             && fingerprint "Rebuild container image (independent runner)" > "$RUNNER_TEMP/fp-b"; then
            {
              echo "### Paths that differ between the two builds (deepest only)"
              echo '```'
              bash scripts/ci/fs-fingerprint-drift.sh "$RUNNER_TEMP/fp-a" "$RUNNER_TEMP/fp-b" | head -n 200
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not read both fs-fingerprints; only the layer comparison is available"
          fi
          exit 1

  # ── Wave-3 Tier-3 prover images — weekly, blocking per image ──────────────
  #
  # Runs on the weekly schedule. Each prover builds in its own matrix cell
  # (fail-fast off), so one broken prover does not mask the others. Blocking
  # since the CI-4 ruling (#416): the scheduled run on main of 2026-11-08
  # (42453284210) passed all eight cells, stub-sentinel detection included.
  #
  # Imandra is excluded: it is proprietary and requires a licence token not
  # available in public CI.
  tier3-container:
    name: Tier-3 / ${{ matrix.prover }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Weekly and on manual dispatch. A red cell is a real failure, but these
    # builds are too slow to gate every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # All targets live in the consolidated .containerization/Containerfile.wave3
        # (shared rust-builder stage, one --target per prover). Each matrix cell
        # is an isolated runner so the shared stage still rebuilds per cell with
        # --no-cache; cross-cell base caching would need a registry and is a
        # deliberate future optimisation, not required for correctness.
        include:
          - prover: tamarin
            image: echidna:tamarin
            version_check: "tamarin-prover --version"
          - prover: proverif
            image: echidna:proverif
            version_check: "proverif -help 2>&1 | head -1"
          - prover: metamath
            image: echidna:metamath
            version_check: "echo exit | metamath 2>&1 | head -1 || true"
          - prover: twelf
            image: "echidna:twelf"
            version_check: "twelf-server --help 2>&1 | head -1 || true"
          - prover: or-tools
            image: echidna:or-tools
            version_check: "ls /usr/local/lib/libortools* 2>/dev/null | head -1 || true"
          - prover: scip
            image: echidna:scip
            version_check: "scip --version 2>&1 | head -1 || true"
          - prover: hol4
            image: echidna:hol4
            version_check: "echo '(* quit *);' | hol 2>&1 | head -1 || true"
          - prover: acl2
            image: echidna:acl2
            version_check: "echo '(acl2::quit)' | acl2 2>&1 | head -3 || true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman

      - name: Build ${{ matrix.prover }} image
        # HOL4 and ACL2 have long build times; give them extra headroom.
        timeout-minutes: 90
        run: |
          podman build \
            -f .containerization/Containerfile.wave3 \
            --target "${{ matrix.prover }}" \
            -t "${{ matrix.image }}" \
            --no-cache \
            .

      - name: Verify ECHIDNA binary inside ${{ matrix.prover }} image
        run: |
          podman run --rm "${{ matrix.image }}" --version

      # version_check is passed via env to avoid the YAML→outer-shell→inner-sh
      # single-quote nesting trap: for acl2 (`echo '(acl2::quit)' | acl2 …`) and
      # hol4 (`echo '(* quit *);' | hol …`), the inline `-c '${{ matrix.version_check }}'`
      # form lets the embedded `'` close the outer string and the bash parser
      # fails with "syntax error near unexpected token `('". Confirmed root-cause
      # of the persistent acl2/hol4 cron red since 2026-04-27 (a87fae12).
      - name: Smoke-check ${{ matrix.prover }} binary
        env:
          VERSION_CHECK: ${{ matrix.version_check }}
        run: |
          podman run --rm --entrypoint /bin/sh "${{ matrix.image }}" \
            -c "$VERSION_CHECK"

      # #75: the per-prover version_check above uses `|| true` for several
      # backends because tools like metamath / hol4 / acl2 exit non-zero on
      # quit. Side effect: a stub fallback (graceful-degrade on a dead
      # upstream pin, see Containerfile.wave3 :: tamarin/proverif/scip/metamath)
      # prints "<prover> not available (... failed at image build time)" and
      # `|| true` swallows it. This step re-runs the check, captures the
      # output verbatim, and fails LOUDLY on any stub sentinel — turning the
      # silent degradation into a visible weekly red.
      - name: Stub-sentinel detection (#75)
        env:
          VERSION_CHECK: ${{ matrix.version_check }}
        run: |
          set +e
          OUTPUT=$(podman run --rm --entrypoint /bin/sh "${{ matrix.image }}" \
            -c "$VERSION_CHECK" 2>&1)
          echo "--- version_check output ---"
          echo "$OUTPUT"
          echo "--- end ---"
          if echo "$OUTPUT" | grep -qiE 'not available \(bundle install failed|not available \(build failed|not available \(source build failed|bundle install failed at image build time|build failed at image build time|source build failed at image build'; then
            echo "::error file=.containerization/Containerfile.wave3::Stub sentinel detected in ${{ matrix.prover }} image. The upstream pin is broken and was masked by graceful fallback — bump the pin (#75)."
            exit 1
          fi
          echo "OK: no stub sentinel for ${{ matrix.prover }}"

      - name: Verify image metadata
        run: |
          podman inspect "${{ matrix.image }}" \
            --format '{{index .Config.Labels "org.opencontainers.image.description"}}'

      - name: Clean up
        if: always()
        run: podman rmi "${{ matrix.image }}" 2>/dev/null || true
