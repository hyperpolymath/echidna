#
# bridge-gate.yml -- merge-orchestration CVE/bump gate.
# Wired from hyperpolymath/hypatia docs/design/merge-orchestration (artifact 4, PR #459).
#
# Gates dependency-bump PRs on:
#   B3  guix bump                  -> fail (Guix removed estate-wide; close, do not merge)
#   B1  reachable unmitigable CVE -> fail (via panic-attack's OSV-backed Patch-Bridge)
# A clean patch/minor CVE-clear bump passes. A failing gate is a red check; to actually
# BLOCK auto-merge, add "bridge-gate" to this repo's required status checks (owner action).
#
# Notes for review:
#  - B2 (major -> review) is left to the existing human-review path; it can be added
#    later via dependabot/fetch-metadata.
#  - panic-attack is built at the commit that static-analysis-gate.yml pins in
#    PANIC_ATTACK_REF. That file owns the pin: this job reads it, so the two
#    workflows cannot use different scanners and no moving ref is built (#481).
#  - github context is passed via env: only (no ${{ }} in run lines) per estate rules.
name: bridge-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  bridge-gate:
    if: ${{ startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: B3 gate -- guix bumps (no network)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == dependabot/guix/* ]]; then
            echo "::error::B3: guix bump -- Guix removed estate-wide; close, do not merge."
            exit 1
          fi

      - name: Build panic-attack at the Static Analysis Gate pin (Patch-Bridge)
        run: |
          set -euo pipefail
          # One pin for both workflows. A missing or floating value builds nothing.
          ref=$(yq -r '.env.PANIC_ATTACK_REF' .github/workflows/static-analysis-gate.yml)
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::static-analysis-gate.yml has no full-SHA PANIC_ATTACK_REF (got '${ref}'); no scanner was built."
            exit 2
          fi
          echo "PANIC_ATTACK_REF=$ref" >> "$GITHUB_ENV"
          tool_root="$RUNNER_TEMP/panic-toolchain"
          # Same build as the Static Analysis Gate: exact revision, locked
          # dependencies, and proof that the installed binary names that revision.
          timeout 600 cargo install --git https://github.com/hyperpolymath/panic-attack \
            --rev "$ref" --locked --features http --root "$tool_root" panic-attack
          grep -Fq "#$ref" "$tool_root/.crates.toml"
          "$tool_root/bin/panic-attack" --version
          jq -cn --arg sha "$ref" \
            --arg digest "$(sha256sum "$tool_root/bin/panic-attack" | cut -d' ' -f1)" \
            --arg rust "$(rustc --version)" --arg cargo "$(cargo --version)" \
            '{source_sha:$sha,binary_sha256:$digest,features:["http"],rustc:$rust,cargo:$cargo}' \
            > "$tool_root/source.json"
          echo "$tool_root/bin" >> "$GITHUB_PATH"

      # The adapter that the Static Analysis Gate uses. It checks the binary
      # against its build receipt and writes a receipt only for a complete
      # schema 0.3.0 report whose vulnerability_data is "queried".
      - name: Bridge triage (queries OSV) -> qualified BridgeReport
        env:
          SCAN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          bash scripts/ci/static-analysis-evidence.sh scan patch-bridge "$PANIC_ATTACK_REF" \
            "$RUNNER_TEMP/panic-toolchain/bin/panic-attack" "$RUNNER_TEMP/panic-toolchain/source.json" \
            "$RUNNER_TEMP/bridge-report"

      # Exit 1: a reachable unmitigable CVE. Exit 2: no qualified report, so
      # there is no CVE result to judge. Controls for both are in
      # scripts/ci/test-static-analysis-evidence.sh.
      - name: Apply B1 verdict -- reachable unmitigable CVE -> flag
        env:
          SCAN_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/ci/static-analysis-evidence.sh bridge-b1 "$RUNNER_TEMP/bridge-report/receipt.json"
