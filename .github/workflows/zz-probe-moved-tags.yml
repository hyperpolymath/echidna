# SPDX-License-Identifier: MPL-2.0
# ONE-OFF, scratch branch only, deleted after use. Live probe for
# hyperpolymath/standards#1350: calls the two reusables whose dtolnay pins no
# current tag names (standards@75bd5994 mirror-reusable -> rust-toolchain@e2a55d2,
# panic-attack@b689a74 scan-and-report -> rust-toolchain@02cb101). No secrets
# are passed, so every mirror push and the cross-repo dispatch skip. The run
# starts only if actions.lock closes over both pins.
name: one-off moved-tag probe
on:
  push:
    branches: [claude/compassionate-fermat-9x7vpe]
permissions:
  actions: read
  contents: read
jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66 # main 2026-08-04
  scan:
    uses: hyperpolymath/panic-attack/.github/workflows/scan-and-report.yml@b689a74d2762a1c19839ae3fbd59b7fe5ef920ea # main 2026-10-01
