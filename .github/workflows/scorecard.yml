name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analysis:
    # Job-level permissions REPLACE the workflow-level read-only block, so
    # contents: read must be restated here — the reusable declares it
    # (checkout needs it) and startup-fails if the caller doesn't grant it.
    permissions:
      actions: read
      security-events: write
      id-token: write
      contents: read
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9 # published source, 2026-11-04
