name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  analysis:
    # Job-level permissions REPLACE the workflow-level read-all block, so
    # contents: read must be restated here — the reusable declares it
    # (checkout needs it) and startup-fails if the caller doesn't grant it.
    permissions:
      actions: read
      security-events: write
      id-token: write
      contents: read
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@3c00687a5bbd0d881d351db8502417b5d0a8b0b0 # main 2026-10-20, standards#1315 hypatia-ref aa34a4cc (lockfile-bearing ref: actions.lock required by caller-side enforcement, standards#570)
