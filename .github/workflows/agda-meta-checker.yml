# CI workflow for ECHIDNA Agda meta-checker
# Type-checks all formal proofs verifying trust pipeline correctness

name: Agda Meta-Checker

on:
  push:
    branches: [main]
    paths:
      - 'meta-checker/**'
  # No paths-filter on pull_request: this is a REQUIRED status check, so it must
  # report on every PR (a path-filtered required check deadlocks PRs that don't
  # touch its paths). The "Detect relevant changes" step path-gates internally.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cause-B mitigation (#77): cancel superseded runs so stacked pushes
# to the same ref don't pile up identical jobs in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # change-detector reads the PR's file list (gh api pulls/.../files)

jobs:
  verify-proofs:
    name: Type-check Agda proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Required-check shim: only the meta-checker/ tree needs the real proof
      # check. Non-PR events (push, workflow_dispatch) always run it.
      - name: Detect relevant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATTERN='^meta-checker/'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate --jq '.[].filename')
            if printf '%s\n' "$FILES" | grep -qE "$PATTERN"; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "meta-checker/ sources changed — running full Agda type-check."
            else
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              echo "No meta-checker changes — pass-through (required-check shim)."
            fi
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — running full Agda type-check."
          fi

      - name: Setup Haskell
        if: steps.detect.outputs.relevant == 'true'
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - name: Cache Agda
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal
            ~/.agda
          key: agda-${{ runner.os }}-${{ hashFiles('meta-checker/**/*.agda') }}

      - name: Install Agda
        if: steps.detect.outputs.relevant == 'true'
        run: |
          cabal update
          # --overwrite-policy=always: the cached ~/.cabal restore already
          # carries the agda symlink, so a plain install aborts with
          # "Path '.../bin/agda' already exists" on a warm cache.
          cabal install Agda-2.7.0.1 --overwrite-policy=always

      - name: Install Agda standard library
        if: steps.detect.outputs.relevant == 'true'
        run: |
          mkdir -p ~/.agda
          cd /tmp
          wget -q https://github.com/agda/agda-stdlib/archive/refs/tags/v2.1.tar.gz
          tar xzf v2.1.tar.gz
          echo "/tmp/agda-stdlib-2.1/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults

      - name: Type-check meta-checker (PROOF-POLICY §2.1 canonical invocation)
        if: steps.detect.outputs.relevant == 'true'
        run: |
          cd meta-checker
          echo "$PWD/echidna-meta.agda-lib" >> ~/.agda/libraries
          # Canonical invocation, PROOF-POLICY §2.1. --safe is what excludes
          # postulates, --type-in-type and primTrustMe; it is not a grep.
          # NEVER weaken these flags to get a green run: a failing leg is the
          # finding. Note --cubical-compatible is NOT --cubical: the
          # -W[no]UnsupportedIndexedMatch warnings this emits mean the flagged
          # functions do not compute under transports. Recorded as a limit in
          # docs/PROOF-STATUS.adoc R4.
          agda --safe --without-K --cubical-compatible src/Echidna/MetaChecker.agda

      - name: Assert the checked closure covers every module
        if: steps.detect.outputs.relevant == 'true'
        run: |
          cd meta-checker
          # A module that nothing imports gets no interface and is never
          # type-checked — AxiomTrackerCompleteness.agda sat outside the
          # closure, and did not parse, until 2026-11-01. Guard against a
          # repeat: every source module must yield an interface.
          src=$(ls src/Echidna/*.agda | wc -l)
          iface=$(find . -name '*.agdai' | wc -l)
          echo "source modules: $src, interfaces produced: $iface"
          if [ "$src" -ne "$iface" ]; then
            echo "::error::${src} modules but ${iface} interfaces — at least one module is outside the checked closure"
            ls -1 src/Echidna/*.agda
            exit 1
          fi
          echo "✓ ${iface} modules type-checked under the PROOF-POLICY §2.1 flags"
