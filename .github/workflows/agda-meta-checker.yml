# CI workflow for ECHIDNA Agda meta-checker
# Type-checks all formal proofs verifying trust pipeline correctness

name: Agda Meta-Checker

on:
  push:
    branches: [main]
    paths:
      - 'meta-checker/**'
      - 'scripts/ci/*agda.sh'
      - 'scripts/ci/check-receipt-controls.sh'
      - '.github/workflows/agda-meta-checker.yml'
  # No paths-filter on pull_request: this is a REQUIRED status check, so it must
  # report on every PR (a path-filtered required check deadlocks PRs that don't
  # touch its paths). The "Detect relevant changes" step path-gates internally.
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

# Cause-B mitigation (#77): cancel superseded runs so stacked pushes
# to the same ref don't pile up identical jobs in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # change-detector reads the PR's file list (gh api pulls/.../files)

jobs:
  verify-proofs:
    name: Type-check Agda proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Required-check shim: only the meta-checker/ tree needs the real proof
      # check. Non-PR events (push, workflow_dispatch) always run it.
      - name: Detect relevant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATTERN='^(meta-checker/|scripts/ci/(setup-agda|check-agda|check-receipt-controls|agda-cone-receipt|test-agda-cone-receipt)\.sh$|\.github/workflows/agda-meta-checker\.yml$)'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate --jq '.[].filename')
            if printf '%s\n' "$FILES" | grep -E "$PATTERN" > /dev/null; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "meta-checker/ sources changed — running full Agda type-check."
            else
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              echo "NOT APPLICABLE: proof source/tooling paths unchanged; compiler did not run."
            fi
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — running full Agda type-check."
          fi

      - name: Cache pinned Agda archives
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/echidna/agda
          key: agda-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/setup-agda.sh') }}

      - name: Install pinned Agda and standard library
        if: steps.detect.outputs.relevant == 'true'
        run: bash scripts/ci/setup-agda.sh

      - name: Type-check meta-checker (PROOF-POLICY §2.1 canonical invocation)
        if: steps.detect.outputs.relevant == 'true'
        run: bash scripts/ci/check-agda.sh

      # PROOF-POLICY §8.2/§8.4: the receipt a PWG-3 grade is derived from. It
      # records the toolchain, the flags, the import cone of the theory
      # module with a digest per file, and a comment-aware postulate scan of
      # that cone. The receipt is printed to the log and the step summary.
      - name: Record the §8.2 cone receipt for the theory theorems (Receipt.agda)
        if: steps.detect.outputs.relevant == 'true'
        env:
          AGDA_STDLIB_SHA256: 72ca3ea25094efa0439e106f0d949330414232ec4cc5c3c3316e7e70dd06d431
        run: |
          set -euo pipefail
          bash scripts/ci/test-agda-cone-receipt.sh
          receipt="$RUNNER_TEMP/agda-cone-receipt.json"
          (cd meta-checker && bash ../scripts/ci/agda-cone-receipt.sh src/Echidna/Receipt.agda) > "$receipt"
          cat "$receipt"
          {
            echo '## PROOF-POLICY §8.2 cone receipt (Receipt.agda)'
            jq -r '"commit \(.source.commit), \(.toolchain.agda), \(.import_cone.count) modules in the import cone, postulate scan: \(.postulate_scan.result)"' "$receipt"
            echo
            echo '```json'
            cat "$receipt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
