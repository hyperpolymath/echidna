name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:

# Cause-B mitigation (#77): cancel superseded runs so stacked pushes
# to the same ref don't pile up identical jobs in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/panic-attack/.github/workflows/scan-and-report.yml@0ebbc93a5bd298cf82ccf95b3897cfe9bf86092e # main 2026-11-10: builds the scanner at the workflow commit, not the caller (panic-attack#276)
    secrets:
      VERISIMDB_PAT: ${{ secrets.VERISIMDB_PAT }}
