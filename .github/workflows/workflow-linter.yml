# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - '.hypatia-ignore'
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - '.hypatia-ignore'
  workflow_dispatch:
    inputs:
      refresh_actions_lock:
        description: Generate an official actions.lock candidate for review
        type: boolean
        required: false
        default: false

permissions: read-all

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check workflow policy and issue regressions
        # Duplicate YAML keys are rejected before Actions creates any jobs.
        # Also validates SPDX in the comment preamble (actions-lock inserts a
        # banner before it), permissions, migration exemptions and risk routing.
        run: bash scripts/ci/test-issue-regressions.sh

      # Ultraplan Phase 2.3 (tracking issue #416): every continue-on-error unit
      # needs an owner issue and an unexpired date on the same line.
      - name: Allow-fail units have an owner and an unexpired date
        run: bash scripts/ci/check-allow-fail-expiry.sh

      # actions.lock is verified by governance's lockfile check (standards
      # scripts/update-actions-lock.sh): one tested implementation, one
      # gh-actions-lock pin, and it accepts reusable-workflow coverage. The step
      # that stood here pinned its own v0.1.6 binary, which cannot read
      # lockfile v0.0.3, so it failed whenever a current tool wrote the lock.

      # Opt-in repair surface, not verification of the committed lock. The
      # canonical governance gate above remains authoritative after application.
      # No write token, commit, push, or automatic admission is involved.
      - name: Prepare official actions.lock refresh candidate
        if: >-
          always() &&
          ((github.event_name == 'workflow_dispatch' && inputs.refresh_actions_lock) ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'ci:refresh-actions-lock')))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          for tool in gh jq yq gawk; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool missing; lock refresh NOT RUN"
              exit 2
            fi
          done
          gh extension install github/gh-actions-lock --pin v0.2.0
          authority="$RUNNER_TEMP/lock-authority"
          subject="$RUNNER_TEMP/lock-subject"
          authority_sha=d3e4b485a2af90c92a8e18af0888cd19cb132cd9
          git init -q "$authority"
          git -C "$authority" remote add origin https://github.com/metadatastician/standards.git
          git -C "$authority" fetch -q --depth 1 origin "$authority_sha"
          git -C "$authority" checkout -q --detach FETCH_HEAD
          test "$(git -C "$authority" rev-parse HEAD)" = "$authority_sha"
          source_sha=$(git rev-parse HEAD)
          git clone -q --no-hardlinks "$GITHUB_WORKSPACE" "$subject"
          git -C "$subject" checkout -q --detach "$source_sha"
          git -C "$subject" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          export REGEN_TOOLS="$authority/scripts"
          # Reuse the authority's complete repair and verification sequence.
          # It restores all workflow bytes before closing/pruning the lock;
          # raw generator rewrites to floating refs are never a candidate.
          source "$REGEN_TOOLS/regen-dependabot-locks.sh"
          outcome=$(regen_lock "$subject" 2> "$RUNNER_TEMP/actions-lock-refresh.log")
          cat "$RUNNER_TEMP/actions-lock-refresh.log"
          case "$outcome" in
            changed|current) ;;
            *) echo "::error::Canonical lock generation failed: $outcome"; exit 2 ;;
          esac
          git -C "$subject" diff --quiet -- . ':(exclude).github/workflows/actions.lock'
          patch="$RUNNER_TEMP/actions-lock-refresh.patch"
          git -C "$subject" diff --binary -- .github/workflows/actions.lock > "$patch"
          if [ "$(wc -c < "$patch")" -gt 900000 ]; then
            echo "::error::Candidate exceeds the summary budget; this workflow cannot publish it"
            exit 2
          fi
          {
            echo '## Official actions.lock refresh candidate'
            echo
            echo "Source checkout: $source_sha"
            echo "Canonical generation outcome: $outcome"
            echo 'Uncommitted lock-only candidate; all workflow bytes preserved. Re-run canonical governance on the committed result.'
            echo
            echo '````diff'
            cat "$patch"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$patch"
