# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Keep these job names: branch protection requires their existing contexts.
# Artifacts are scan observations, not verified repairs or training receipts.
name: Static Analysis Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Exact Hypatia repair canary: Agda keyword boundaries and patched dependencies.
  # panic-attack runs ahead of the standards-vetted 410a8f8 (hypatia-scan-reusable
  # default) because that commit cannot report complete coverage for this tree:
  # 190 config/markup inputs were "unsupported", so --fail-on-incomplete exited 2
  # before any finding was counted. f2a6a70 includes the coverage repair
  # (panic-attack#258: 913/913 inputs here) and Patch Bridge schema 0.3.0
  # (vulnerability_data), which the qualifier below checks.
  HYPATIA_REF: 82396d81677b11d17c7a0dede5bf0efcf768d5a1
  PANIC_ATTACK_REF: f2a6a70eaec0cb02331e3264e05f185b5faab0f7
  SCAN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-24.04
    # Ten-minute cold build + five-minute scan, with time to preserve evidence.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner receipt controls
        run: bash scripts/ci/test-static-analysis-evidence.sh
      - name: Build pinned panic-attack with Patch Bridge support
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/panic-toolchain"
          # The canonical build defaults to no optional features. Bridge is
          # compiled only with http; build once and reuse this exact binary.
          timeout 600 cargo install --git https://github.com/hyperpolymath/panic-attack \
            --rev "$PANIC_ATTACK_REF" --locked --features http --root "$tool_root" panic-attack
          grep -Fq "#$PANIC_ATTACK_REF" "$tool_root/.crates.toml"
          "$tool_root/bin/panic-attack" --version
          "$tool_root/bin/panic-attack" bridge triage --help
          jq -cn --arg sha "$PANIC_ATTACK_REF" \
            --arg digest "$(sha256sum "$tool_root/bin/panic-attack" | cut -d' ' -f1)" \
            --arg rust "$(rustc --version)" --arg cargo "$(cargo --version)" \
            '{source_sha:$sha,binary_sha256:$digest,features:["http"],rustc:$rust,cargo:$cargo}' \
            > "$tool_root/source.json"
      - name: Preserve the pinned scanner for Patch Bridge
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: panic-attack-toolchain
          path: |
            ${{ runner.temp }}/panic-toolchain/bin/panic-attack
            ${{ runner.temp }}/panic-toolchain/source.json
          if-no-files-found: error
          retention-days: 7
      - name: Run panic-attack assail
        if: always()
        run: |
          bash scripts/ci/static-analysis-evidence.sh scan panic-attack "$PANIC_ATTACK_REF" \
            "$RUNNER_TEMP/panic-toolchain/bin/panic-attack" "$RUNNER_TEMP/panic-toolchain/source.json" \
            "$RUNNER_TEMP/panic-attack-findings"
      - name: Upload panic-attack findings and completion receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: panic-attack-findings
          path: ${{ runner.temp }}/panic-attack-findings/
          if-no-files-found: error
          retention-days: 90
      - name: Require completed scan and reject critical findings
        if: always()
        run: bash scripts/ci/static-analysis-evidence.sh gate "$RUNNER_TEMP/panic-attack-findings/receipt.json"

  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Elixir for Hypatia scanner
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Build pinned Hypatia
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/hypatia"
          git init -q "$scanner"
          timeout 60 git -C "$scanner" fetch -q --depth 1 https://github.com/hyperpolymath/hypatia.git "$HYPATIA_REF"
          git -C "$scanner" checkout -q --detach FETCH_HEAD
          test "$(git -C "$scanner" rev-parse HEAD)" = "$HYPATIA_REF"
          (
            cd "$scanner"
            timeout 600 bash -c 'set -euo pipefail; mix deps.get; mix escript.build'
          )
          test -x "$scanner/hypatia"
          jq -cn --arg sha "$(git -C "$scanner" rev-parse HEAD)" \
            --arg digest "$(sha256sum "$scanner/hypatia" | cut -d' ' -f1)" \
            '{source_sha:$sha,binary_sha256:$digest}' > "$scanner/source.json"
      - name: Run Hypatia scan
        if: always()
        run: |
          bash scripts/ci/static-analysis-evidence.sh scan hypatia "$HYPATIA_REF" \
            "$RUNNER_TEMP/hypatia/hypatia" "$RUNNER_TEMP/hypatia/source.json" \
            "$RUNNER_TEMP/hypatia-findings"
      - name: Upload Hypatia findings and completion receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: hypatia-findings
          path: ${{ runner.temp }}/hypatia-findings/
          if-no-files-found: error
          retention-days: 90
      - name: Require completed scan and reject critical findings
        if: always()
        run: bash scripts/ci/static-analysis-evidence.sh gate "$RUNNER_TEMP/hypatia-findings/receipt.json"

  patch-bridge-triage:
    name: Patch Bridge CVE triage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: panic-attack-assail
    # A critical assail finding must not prevent CVE triage or its receipt.
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the exact pinned panic-attack build
        uses: actions/download-artifact@v8.0.2
        with:
          name: panic-attack-toolchain
          path: ${{ runner.temp }}/panic-toolchain/
      - name: Run Patch Bridge triage
        if: always()
        run: |
          # Artifact transfer does not retain executable bits; the scan adapter
          # verifies the binary digest against the build receipt before use.
          binary="$RUNNER_TEMP/panic-toolchain/bin/panic-attack"
          if [ -f "$binary" ]; then chmod +x "$binary"; fi
          bash scripts/ci/static-analysis-evidence.sh scan patch-bridge "$PANIC_ATTACK_REF" \
            "$binary" "$RUNNER_TEMP/panic-toolchain/source.json" "$RUNNER_TEMP/bridge-report"
      - name: Upload bridge report and completion receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: bridge-report
          path: ${{ runner.temp }}/bridge-report/
          if-no-files-found: error
          retention-days: 90
      - name: Require completed triage and report unmitigable CVEs
        if: always()
        # Classification remains advisory; execution failure is not a clean CVE result.
        run: bash scripts/ci/static-analysis-evidence.sh gate "$RUNNER_TEMP/bridge-report/receipt.json"

  deposit-findings:
    name: Deposit findings for gitbot-fleet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [panic-attack-assail, hypatia-scan, patch-bridge-triage]
    if: always()
    steps:
      - name: Checkout the scanned revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download panic-attack evidence
        if: always()
        uses: actions/download-artifact@v8.0.2
        with:
          name: panic-attack-findings
          path: findings/panic-attack-findings/
      - name: Download Hypatia evidence
        if: always()
        uses: actions/download-artifact@v8.0.2
        with:
          name: hypatia-findings
          path: findings/hypatia-findings/
      - name: Download Patch Bridge evidence
        if: always()
        uses: actions/download-artifact@v8.0.2
        with:
          name: bridge-report
          path: findings/bridge-report/
      - name: Validate completion and combine observations
        id: combine
        if: always()
        run: bash scripts/ci/static-analysis-evidence.sh deposit findings
      - name: Preserve raw evidence and deposit status
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: static-analysis-evidence
          path: findings/
          if-no-files-found: error
          retention-days: 90
      - name: Upload complete unified findings
        if: steps.combine.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: unified-findings
          path: findings/unified-findings.json
          if-no-files-found: error
          retention-days: 90
      - name: Write deposit summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Static analysis evidence deposit'
            echo ''
            jq -r '"Complete scanner evidence: **\(.complete)**\n", (.scanners[] | "- \(.tool): \(.status)")' findings/deposit-status.json
            echo ''
            echo 'Raw reports and completion receipts are archived in static-analysis-evidence.'
            echo 'unified-findings is produced only when every receipt matches this source revision and run.'
            echo 'These are observations. Fleet ingestion and verified repair learning are not confirmed by this upload.'
          } >> "$GITHUB_STEP_SUMMARY"
