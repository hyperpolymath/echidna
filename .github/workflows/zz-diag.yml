# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic workflow. Deliberately contains no `uses:` steps: a
# newly added workflow in this repo that references an action fails at
# startup ("This run likely failed because of a workflow file issue"), so
# this clones by hand and reports through a PR comment, which is readable
# from environments where the job log endpoint is blocked.
# Delete once the branch is green.
name: ZZ diag

on:
  push:
    branches: [arena/5b8efe75-echidna]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Collect diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          OUT=/tmp/diag.txt
          : > "${OUT}"
          say() { printf '%s\n' "$*" >> "${OUT}"; }
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq capnproto protobuf-compiler pkg-config libssl-dev >/dev/null 2>&1
          git clone -q --depth 5 --branch arena/5b8efe75-echidna \
            "https://x-access-token:${GH_TOKEN}@github.com/hyperpolymath/echidna.git" repo 2>>"${OUT}"
          cd repo || exit 1

          cargo fmt --all
          {
            echo '=== FMT PATCH (base64) ==='
            git -C . diff > /tmp/fmt.patch
            base64 -w 100 /tmp/fmt.patch
            echo "=== FMT PATCH END ($(wc -c < /tmp/fmt.patch) bytes) ==="
          } >> "${OUT}"

          {
            echo '=== TEST echidna-core-creusot ==='
            cargo test --locked -p echidna-core-creusot 2>&1 | tail -n 60
            echo '=== TEST corpus_estate_adapters + corpus_cli_dispatch + lexicon_v2 ==='
            cargo test --locked --test corpus_estate_adapters --test corpus_cli_dispatch \
              --test lexicon_v2_test 2>&1 | grep -vE '^\s+Compiling|^\s+Checking' | tail -n 120
            echo '=== CLIPPY workspace ==='
            cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 \
              | grep -E '^(error|warning)' -A 6 | head -n 200
            echo '=== END ==='
          } >> "${OUT}"

          jq -Rs '{body: .}' < "${OUT}" > /tmp/body.json
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hyperpolymath/echidna/issues/448/comments \
            -d @/tmp/body.json)
          echo "comment status: ${CODE}"
          test "${CODE}" = "201"
