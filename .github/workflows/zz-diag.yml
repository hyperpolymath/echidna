# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic: run `cargo check` / `cargo clippy` / `cargo fmt
# --check` and commit the output to `.diag/` on this branch, because the branch
# is prepared in an environment with no Rust toolchain and job logs are not
# reachable from it. Self-terminating (skips when `.diag/` already exists, and
# the commit carries `[skip ci]`). Delete before merge.
name: ZZ diag

on:
  push:
    branches: [arena/5b8efe75-echidna]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check and record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git clone -q --depth 1 --branch arena/5b8efe75-echidna \
            "https://x-access-token:${GH_TOKEN}@github.com/hyperpolymath/echidna.git" repo || exit 1
          cd repo
          if [ -f .diag/cargo-check.txt ]; then echo "diagnostics already recorded"; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq capnproto protobuf-compiler pkg-config libssl-dev
          mkdir -p .diag
          {
            echo "## cargo check --locked --workspace --all-targets"
            cargo check --locked --workspace --all-targets > /tmp/check.raw 2>&1
            echo "exit: $?"
            grep -E '^(error|warning)' -A 14 /tmp/check.raw | head -c 60000
            echo
            echo "## cargo clippy --locked --workspace --all-targets"
            cargo clippy --locked --workspace --all-targets > /tmp/clippy.raw 2>&1
            echo "exit: $?"
            grep -E '^error' -A 14 /tmp/clippy.raw | head -c 40000
            echo
            echo "## cargo fmt --all -- --check"
            cargo fmt --all -- --check > /tmp/fmt.raw 2>&1
            echo "exit: $?"
            head -c 20000 /tmp/fmt.raw
          } > .diag/cargo-check.txt
          git config user.name "echidna-diag-bot"
          git config user.email "echidna-diag-bot@users.noreply.github.com"
          git add -f .diag/cargo-check.txt
          git commit -qm "diag: cargo check output [skip ci]"
          git push -q origin HEAD:arena/5b8efe75-echidna
