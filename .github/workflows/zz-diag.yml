# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic workflow. Deliberately contains no `uses:` steps: any
# newly added workflow in this repo that references an action fails at
# startup ("This run likely failed because of a workflow file issue"), so
# this clones by hand and posts its output as a PR comment, which is
# readable from environments where the job log endpoint is blocked.
# Delete once the branch is green.
name: ZZ diag

on:
  push:
    branches: [arena/5b8efe75-echidna]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Collect diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq capnproto protobuf-compiler pkg-config libssl-dev
          git clone -q --depth 5 --branch arena/5b8efe75-echidna \
            "https://x-access-token:${GH_TOKEN}@github.com/hyperpolymath/echidna.git" repo
          cd repo
          {
            echo '### toolchain'
            (cargo --version; rustc --version) 2>&1
            echo
            echo '### rustfmt --check (diff)'
            cargo fmt --all -- --check 2>&1 | head -n 200
            echo
            echo '### cargo check'
            cargo check --locked --workspace --all-targets 2>&1 \
              | grep -E '^(error|warning)' -A 8 | head -n 400
          } > /tmp/diag.txt 2>&1
          printf '%s\n' "$(head -c 55000 /tmp/diag.txt)" > /tmp/body.txt
          jq -Rs '{body: .}' /tmp/body.txt > /tmp/body.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hyperpolymath/echidna/issues/448/comments \
            -d @/tmp/body.json -o /tmp/resp.json
          head -c 200 /tmp/resp.json
