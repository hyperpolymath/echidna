# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic: `cargo check` the tree and publish the compiler output
# to a pollable topic, because this branch is prepared in an environment with
# no Rust toolchain (and job logs are not reachable from it).
# No `uses:` steps on purpose — a newly added workflow here that references an
# action fails at startup. Delete before merge.
name: ZZ diag

on:
  push:
    branches: [arena/5b8efe75-echidna]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check and publish
        env:
          T: https://ntfy.sh/echidna-err-7f3a91
        run: |
          set -u
          publish() {
            file=$1; topic=$2; n=$(wc -c < "$file")
            if [ "$n" -eq 0 ]; then printf '%s\n' "(no output)" | curl -sS -m 20 --data-binary @- "https://ntfy.sh/$topic" >/dev/null 2>&1; return 0; fi
            split -b 3600 -d -a 3 "$file" /tmp/chunk.
            for c in /tmp/chunk.*; do curl -sS -m 20 --data-binary @"$c" "https://ntfy.sh/$topic" >/dev/null 2>&1; done
          }
          git clone -q --depth 1 --branch arena/5b8efe75-echidna \
            https://github.com/hyperpolymath/echidna.git repo || exit 1
          cd repo
          sudo apt-get update -qq
          sudo apt-get install -y -qq capnproto protobuf-compiler pkg-config libssl-dev
          cargo check --locked --workspace --all-targets > /tmp/check.raw 2>&1
          echo "cargo check exit $?" > /tmp/c.out
          grep -E '^(error|warning)' -A 12 /tmp/check.raw | head -c 38000 > /tmp/check.txt
          { cat /tmp/c.out; echo '=== cwd check ==='; cat /tmp/check.txt; } > /tmp/out1
          publish /tmp/out1 "${T#https://ntfy.sh/}"

          cargo clippy --locked --workspace --all-targets 2>&1 > /tmp/clippy.raw || true
          grep -E '^error' -A 12 /tmp/clippy.raw | head -c 20000 > /tmp/clippy.txt
          publish /tmp/clippy.txt "echidna-err2-7f3a91"

          cargo fmt --all -- --check > /tmp/fmt.raw 2>&1
          echo "fmt exit $?" > /tmp/fmt.out
          { cat /tmp/fmt.out; head -c 12000 /tmp/fmt.raw; } > /tmp/fmt2
          publish /tmp/fmt2 "echidna-err3-7f3a91"
