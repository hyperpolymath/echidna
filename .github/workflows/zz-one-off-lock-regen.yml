# SPDX-License-Identifier: MPL-2.0
# ONE-OFF, removed again before the PR leaves draft. Regenerates echidna's own
# actions.lock with the estate repair order (regen_lock in
# standards/scripts/regen-dependabot-locks.sh: gh actions-lock, relock-sha-keys,
# complete-job-refs, close-lock, prune-stale), on a tree where this file is
# already deleted, then checks the result with close-lock (dangling count),
# `gh actions-lock --verify`, check-lock-sync, the governance gate, and a
# Hypatia scan at aa34a4cc. Three variants of the caller pins are measured:
#   v0  pins as on main
#   v1  panic-attack scan-and-report.yml -> panic-attack main (8955f615)
#   v2  v1 + every hyperpolymath/standards reusable -> 3c00687a (standards#1315)
# It has no `uses:` steps, so it needs no lock entry to start. It writes
# nothing back: the lock is printed and reaches the repository in a reviewed
# commit.
name: one-off actions.lock regeneration
on:
  push:
    branches: [claude/stoic-brown-26h7xi]
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [v0, v1, v2]
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: ${{ matrix.variant }}
      BRANCH: claude/stoic-brown-26h7xi
      STANDARDS_SHA: 3c00687a5bbd0d881d351db8502417b5d0a8b0b0
      STANDARDS_OLD_SHA: 75bd5994470661a099df562d6d5ad2fe744dbd66
      PANIC_OLD_SHA: b689a74d2762a1c19839ae3fbd59b7fe5ef920ea
      PANIC_NEW_SHA: 8955f615f769204e42340e08bdea2de9d72e81cd
      HYPATIA_SHA: aa34a4cc6ba39d873710ff39763fdb9cde715f9d
    steps:
      - name: Regenerate actions.lock and verify it
        run: |
          set +e -uo pipefail
          cd "$RUNNER_TEMP"
          git clone --quiet --branch "$BRANCH" https://github.com/hyperpolymath/echidna.git ec
          git -C ec log --oneline -1
          cp ec/.github/workflows/actions.lock lock.main
          # The tree the PR lands: this one-off file deleted, pins per variant.
          git -C ec rm --quiet .github/workflows/zz-one-off-lock-regen.yml
          if [ "$VARIANT" != v0 ]; then
            sed -i "s/$PANIC_OLD_SHA/$PANIC_NEW_SHA/" ec/.github/workflows/security-scan.yml
          fi
          if [ "$VARIANT" = v2 ]; then
            grep -l "hyperpolymath/standards/.github/workflows/.*@$STANDARDS_OLD_SHA" ec/.github/workflows/*.yml \
              | xargs sed -i "s#\(hyperpolymath/standards/.github/workflows/[^@]*\)@$STANDARDS_OLD_SHA#\1@$STANDARDS_SHA#"
          fi
          git -C ec add -A
          git -C ec diff --cached --stat
          git -C ec diff --cached -- . ':(exclude).github/workflows/zz-one-off-lock-regen.yml'
          git -C ec -c user.name=regen -c user.email=regen@localhost commit --quiet -m "variant $VARIANT"
          git clone --quiet https://github.com/hyperpolymath/standards.git std
          git -C std worktree add --quiet --detach ../std-new "$STANDARDS_SHA"
          git -C std worktree add --quiet --detach ../std-old "$STANDARDS_OLD_SHA"
          sudo apt-get install -y -qq gawk >/dev/null
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --version
          export GH_BIN=gh REGEN_TOOLS="$PWD/std-new/scripts"
          source std-new/scripts/regen-dependabot-locks.sh
          set +e
          outcome="$(regen_lock "$PWD/ec")"
          echo "OUTCOME[$VARIANT]=$outcome"
          git -C ec status --porcelain
          echo "== close-lock re-run (expect dangling refs: 0, exit 0)"
          (cd ec && GH_BIN=gh bash ../std-new/scripts/close-lock.sh; echo "CLOSE_RC[$VARIANT]=$?")
          git -C ec diff --quiet -- .github/workflows/actions.lock && echo "lock unchanged vs variant commit" || echo "lock differs from the variant commit (expected: regenerated)"
          echo "== independent dangling-edge count"
          L=ec/.github/workflows/actions.lock
          awk '/^dependencies:/{f=1;next} f&&match($0,/^    '\''[^'\'']+'\'':$/){k=$0;sub(/^    '\''/,"",k);sub(/'\'':$/,"",k);print k}' "$L" | LC_ALL=C sort -u > keys.txt
          { awk '/^workflows:/{f=1;next} f&&/^[a-z_]+:/{f=0} f&&match($0,/^        - '\''[^'\'']+'\''/){k=$0;sub(/^        - '\''/,"",k);sub(/'\''.*$/,"",k);print k}' "$L"
            awk '/^dependencies:/{f=1} f&&match($0,/^            - '\''[^'\'']+'\''/){k=$0;sub(/^            - '\''/,"",k);sub(/'\''.*$/,"",k);print k}' "$L"; } | LC_ALL=C sort -u > edges.txt
          echo "DANGLING[$VARIANT]=$(LC_ALL=C comm -23 edges.txt keys.txt | grep -c .)"
          LC_ALL=C comm -23 edges.txt keys.txt
          echo "== gh actions-lock --verify"
          (cd ec && gh actions-lock --verify; echo "VERIFY_RC[$VARIANT]=$?")
          git -C ec status --porcelain
          git -C ec checkout --quiet -- . ':(exclude).github/workflows/actions.lock'
          echo "== update-actions-lock.sh --verify-local"
          (cd ec && GH_BIN=gh bash ../std-new/scripts/update-actions-lock.sh --verify-local; echo "VERIFY_LOCAL_RC[$VARIANT]=$?")
          echo "== check-lock-sync.sh"
          (cd ec && bash ../std-new/scripts/check-lock-sync.sh .github/workflows; echo "SYNC_RC[$VARIANT]=$?")
          for g in std-old std-new; do
            echo "== governance lock gate at $g"
            (cd ec && ACTIONS_LOCK_VERIFIER="$PWD/../$g/scripts/update-actions-lock.sh" \
              bash "../$g/scripts/check-actions-lock-gate.sh" .github/workflows; echo "GATE_RC[$VARIANT/$g]=$?")
          done
          git -C ec checkout --quiet -- . ':(exclude).github/workflows/actions.lock'
          git -C ec status --porcelain
          echo "== diff against main's lock"
          diff -u lock.main "$L"
          echo "LOCK-SHA256[$VARIANT] $(sha256sum < "$L" | cut -d' ' -f1)"
          echo "LOCK-B64[$VARIANT] $(base64 -w0 < "$L")"
          cp "$L" lock.regen
          exit 0

      - name: Hypatia scan at aa34a4cc, main's lock and the regenerated one
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Elixir 1.19.4 / OTP 28.3 from builds.hex.pm (what erlef/setup-beam
          # installs), so this job needs no `uses:` step.
          mkdir -p otp elixir
          curl -fsSL https://builds.hex.pm/builds/otp/ubuntu-24.04/OTP-28.3.tar.gz | tar xz -C otp --strip-components=1
          (cd otp && ./Install -minimal "$PWD" >/dev/null)
          curl -fsSL -o elixir.zip https://builds.hex.pm/builds/elixir/v1.19.4-otp-28.zip
          unzip -q elixir.zip -d elixir
          export PATH="$PWD/otp/bin:$PWD/elixir/bin:$PATH"
          elixir --version
          mix local.hex --force >/dev/null && mix local.rebar --force >/dev/null
          git init -q hy && git -C hy remote add origin https://github.com/hyperpolymath/hypatia.git
          git -C hy fetch -q --depth 1 origin "$HYPATIA_SHA" && git -C hy checkout -q --detach FETCH_HEAD
          git -C hy rev-parse HEAD
          (cd hy && mix deps.get >/dev/null && mix escript.build >/dev/null)
          for which in main regen; do
            cp "lock.$which" ec/.github/workflows/actions.lock
            (cd ec && HYPATIA_FORMAT=json "$RUNNER_TEMP/hy/hypatia-cli.sh" scan . > "$RUNNER_TEMP/findings.$which.json" || true)
            jq -e 'type == "array"' "findings.$which.json" >/dev/null || { echo "scan $which did not produce a JSON array"; head -c 2000 "findings.$which.json"; exit 1; }
            echo "== $VARIANT/$which lock: $(jq length "findings.$which.json") findings; invalid_actions_lock entries: $(jq '[.[] | select(tostring | test("invalid_actions_lock"))] | length' "findings.$which.json")"
            jq -c '.[] | select(tostring | test("invalid_actions_lock|workflow_dependencies_missing"))' "findings.$which.json" | cut -c1-1500
          done
