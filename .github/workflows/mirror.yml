name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@5751b97ed597e560573242f56f1287db159edd00 # main 2026-10-06 (lockfile-bearing ref: actions.lock required by caller-side enforcement, standards#570)
    secrets: inherit
