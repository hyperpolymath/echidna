# cargo-audit.yml — Dependency vulnerability scanning for Rust projects.
# Runs cargo-audit against the RustSec advisory database.
name: Cargo Audit

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  schedule:
    # Recheck unchanged dependencies daily for newly published advisories.
    - cron: '0 6 * * *'

# Cause-B mitigation (#77): cancel superseded runs so stacked pushes
# to the same ref don't pile up identical jobs in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Detect Cargo.lock
        id: detect
        run: |
          if [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cargo.lock is missing; dependency audit NOT RUN"
            echo "Dependency audit NOT RUN: Cargo.lock is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: Install Rust toolchain
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        if: steps.detect.outputs.present == 'true'
        run: bash scripts/ci/install-cargo-audit.sh

      - name: Run cargo audit
        if: steps.detect.outputs.present == 'true'
        run: bash scripts/ci/audit-dependencies.sh
