name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    # caller must grant at least that or the run startup-fails.
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@5751b97ed597e560573242f56f1287db159edd00 # main 2026-10-06 (lockfile-bearing ref: actions.lock required by caller-side enforcement, standards#570)
    secrets: inherit
