{
  name: "Feature request",
  description: "Propose a capability this project does not yet have.",
  labels: [
    "enhancement",
    "needs-triage",
  ],
  body: [
    {
      type: "textarea",
      id: "problem",
      attributes: {
        label: "The problem",
        description: "What are you unable to do today? Describe the situation, not the solution.",
      },
      validations: {
        required: true,
      },
    },
    {
      type: "textarea",
      id: "proposal",
      attributes: {
        label: "Proposed change",
      },
      validations: {
        required: true,
      },
    },
    {
      type: "textarea",
      id: "alternatives",
      attributes: {
        label: "Alternatives considered",
        description: "Including doing nothing — say why that is insufficient.",
      },
      validations: {
        required: false,
      },
    },
    {
      type: "dropdown",
      id: "scope",
      attributes: {
        label: "Scope",
        description: "Would this change the template's shape, and therefore every repo minted from it?",
        options: [
          "Repo-local — affects only this project",
          "Template-wide — would propagate to minted repos",
          "Not sure",
        ],
      },
      validations: {
        required: true,
      },
    },
  ],
}
