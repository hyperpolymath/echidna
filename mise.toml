#
# The toolchain for echidna. Specs are `latest`; mise.lock records the concrete
# version and per-platform checksum of each, so every checkout installs the
# same bits. Refresh both with: mise upgrade && mise lock
# Canon: hyperpolymath/standards 3-practice/provisioning (PROVISIONING-STANDARD §4).
# Estate policy: no python, deno, node/npm/yarn, go, java or make here; the JS
# runtime is bun.
#
# Rust is pinned by rust-toolchain.toml (rustup), not here. Idris2 comes from
# pack, not mise. Chapel has no mise tool; it is optional (--features chapel).

[settings]
lockfile = true

[tools]
just = "latest"
zig = "latest"
protoc = "latest"         # echidna-grpc build script (tonic-build)
julia = "latest"
bun = "latest"
shellcheck = "latest"
yq = "latest"             # KYAML formatting/checks (standards scripts/kyaml-format.sh)
